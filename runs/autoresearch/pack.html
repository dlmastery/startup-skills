<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ascent founder pack — 64 documents</title>
<meta name="description" content="Read the full Ascent founder artifact pack: research, strategy, product, tech, narrative, validation and financials — rendered, cross-linked and sourced.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23312E81'/><path d='M22 72 L50 28 L78 72' stroke='%23D97757' stroke-width='11' fill='none' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EEE6;--paper-raised:#FAF9F5;--ink:#1F1E1D;--ink-soft:#605A57;--rule:#DEDBD2;
  --clay:#D97757;--indigo:#312E81;--teal:#0D9488;--amber:#B45309;
  --serif:'Newsreader',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;--side:310px;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#1B1A19;--paper-raised:#232220;--ink:#F0EEE6;--ink-soft:#A8A29B;--rule:#3A3835;
        --indigo:#A5B4FC;--teal:#5EEAD4;--amber:#FBBF24}
}
*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--clay);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:3px}

/* layout */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{border-right:1px solid var(--rule);background:var(--paper-raised);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 40px}
main{padding:38px 46px 90px;min-width:0}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  main{padding:26px 20px 60px}
}

/* sidebar */
.sbhead{padding:0 22px 16px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.sbhead .home{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.02em;display:inline-block}
.sbhead .home:hover{text-decoration:none;color:var(--clay)}
.sbhead .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:.04em}
.filter{width:calc(100% - 44px);margin:0 22px 16px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;
        background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);
     padding:16px 22px 7px;font-weight:500}
.doc{display:block;padding:6px 22px 6px 22px;font-size:14.6px;color:var(--ink-soft);line-height:1.45;border-left:3px solid transparent}
.doc:hover{color:var(--ink);background:color-mix(in srgb,var(--clay) 7%,transparent);text-decoration:none}
.doc.on{color:var(--ink);border-left-color:var(--clay);background:color-mix(in srgb,var(--clay) 11%,transparent);font-weight:500}
.doc .fn{font-family:var(--mono);font-size:11.4px;color:var(--ink-soft);opacity:.72;display:block}

/* reader */
.crumb{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:22px;letter-spacing:.03em}
article{max-width:78ch}
article h1{font-family:var(--serif);font-size:clamp(30px,4vw,44px);font-weight:500;line-height:1.15;letter-spacing:-.01em;margin:0 0 22px}
article h2{font-family:var(--serif);font-size:28px;font-weight:600;margin:44px 0 14px;line-height:1.22;
           padding-bottom:8px;border-bottom:1px solid var(--rule)}
article h3{font-family:var(--serif);font-size:21.5px;font-weight:600;margin:32px 0 10px}
article h4{font-size:17px;font-weight:700;margin:24px 0 8px;color:var(--ink)}
article p{margin:0 0 17px}
article ul,article ol{margin:0 0 18px 26px}
article li{margin:7px 0}
article li>ul,article li>ol{margin-top:7px;margin-bottom:7px}
article strong{font-weight:700;color:var(--ink)}
article em{font-style:italic}
article hr{border:0;border-top:1px solid var(--rule);margin:36px 0}
article blockquote{border-left:3px solid var(--clay);padding:4px 0 4px 20px;margin:0 0 18px;color:var(--ink-soft);font-style:italic}
article code{font-family:var(--mono);font-size:.88em;background:var(--paper-raised);border:1px solid var(--rule);
             border-radius:4px;padding:1px 5px;color:var(--indigo)}
article pre{background:var(--paper-raised);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;
            overflow-x:auto;margin:0 0 20px}
article pre code{background:none;border:0;padding:0;font-size:13.4px;line-height:1.6;color:var(--ink)}
article a{border-bottom:1px solid color-mix(in srgb,var(--clay) 45%,transparent)}

/* tables: the pack is mostly tables, so these matter most */
.tw{overflow-x:auto;margin:0 0 24px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised)}
article table{border-collapse:collapse;width:100%;font-size:14.6px;line-height:1.55}
article th{position:sticky;top:0;background:var(--paper-raised);text-align:left;font-family:var(--mono);
           font-size:10.8px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);
           font-weight:500;padding:11px 14px;border-bottom:2px solid var(--rule);white-space:nowrap}
article td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
article tr:last-child td{border-bottom:0}
article td code{font-size:.86em}

/* honesty signatures preserved from the artifacts */
.tag{font-family:var(--mono);font-size:.72em;font-weight:500;color:var(--clay);
     background:color-mix(in srgb,var(--clay) 12%,transparent);
     border:1px solid color-mix(in srgb,var(--clay) 28%,transparent);
     border-radius:4px;padding:0 5px;margin:0 1px;white-space:nowrap;vertical-align:.1em}
.tag.roadmap,.tag.assume{color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent);
     border-color:color-mix(in srgb,var(--amber) 32%,transparent);font-weight:700}

/* mermaid */
.mermaid{background:var(--paper-raised);border:1px solid var(--rule);border-radius:10px;padding:22px;
         margin:0 0 24px;overflow-x:auto;text-align:center}
.mermaid svg{max-width:100%;height:auto}

.loading{color:var(--ink-soft);font-family:var(--mono);font-size:14px}
.err{background:color-mix(in srgb,var(--amber) 10%,transparent);border:1px solid var(--amber);
     border-radius:9px;padding:16px 20px;color:var(--ink);font-size:15px}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="sbhead">
      <a class="home" href="index.html">Ascent</a>
      <div class="cnt" id="cnt">loading pack…</div>
    </div>
    <input class="filter" id="filter" type="search" placeholder="Filter documents…" aria-label="Filter documents">
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="crumb" id="crumb"></div>
    <article id="doc"><p class="loading">Loading…</p></article>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
const DEFAULT_DOC = 'README.md';
let DOCS = [];

const dark = matchMedia('(prefers-color-scheme: dark)').matches;
if (window.mermaid) mermaid.initialize({
  startOnLoad:false,
  theme: dark ? 'dark' : 'base',
  themeVariables: dark
    ? {primaryColor:'#2A2860',primaryTextColor:'#F0EEE6',lineColor:'#A5B4FC',fontFamily:'Inter, system-ui, sans-serif'}
    : {primaryColor:'#EEF2FF',primaryTextColor:'#1F1E1D',primaryBorderColor:'#312E81',lineColor:'#312E81',
       secondaryColor:'#F0FDFA',tertiaryColor:'#FAF9F5',fontFamily:'Inter, system-ui, sans-serif'}
});

function buildNav(filter){
  const q = (filter||'').toLowerCase();
  const shown = DOCS.filter(d => !q || d.t.toLowerCase().includes(q) || d.p.toLowerCase().includes(q));
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let last = null;
  for (const d of shown){
    if (d.g !== last){
      const h = document.createElement('div');
      h.className = 'grp'; h.textContent = d.g;
      nav.appendChild(h); last = d.g;
    }
    const a = document.createElement('a');
    a.className = 'doc'; a.href = '#' + d.p; a.dataset.path = d.p;
    a.innerHTML = '';
    a.appendChild(document.createTextNode(d.t));
    const fn = document.createElement('span');
    fn.className = 'fn'; fn.textContent = d.p;
    a.appendChild(fn);
    nav.appendChild(a);
  }
  markActive();
}

function markActive(){
  const cur = decodeURIComponent(location.hash.slice(1)) || DEFAULT_DOC;
  document.querySelectorAll('.doc').forEach(a => a.classList.toggle('on', a.dataset.path === cur));
}

// Wrap the artifacts' own source tags so they read on the page the way they read in the pack.
function chipTags(html){
  return html.replace(/\[([A-D]\d{1,3}(?:-assumption)?)\]/g, (m,t)=>`<span class="tag">[${t}]</span>`)
             .replace(/\[ROADMAP\]/g, '<span class="tag roadmap">[ROADMAP]</span>')
             .replace(/\((assumption[^)]*)\)/g, (m,t)=>`<span class="tag assume">(${t})</span>`);
}

async function render(){
  const path = decodeURIComponent(location.hash.slice(1)) || DEFAULT_DOC;
  const el = document.getElementById('doc');
  const crumb = document.getElementById('crumb');
  el.innerHTML = '<p class="loading">Loading ' + path + '…</p>';
  crumb.textContent = '';
  try {
    const res = await fetch(path, {cache:'no-cache'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();

    // Pull mermaid fences out before markdown parsing, then re-insert as diagrams.
    const blocks = [];
    const stripped = md.replace(/```mermaid\n([\s\S]*?)```/g, (m, code) => {
      blocks.push(code);
      return `\n\nMERMAIDBLOCK${blocks.length - 1}ENDBLOCK\n\n`;
    });

    let html = marked.parse(stripped, {mangle:false, headerIds:true});
    html = chipTags(html);
    html = html.replace(/<p>MERMAIDBLOCK(\d+)ENDBLOCK<\/p>/g,
      (m,i) => `<div class="mermaid">${blocks[i].replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`);

    el.innerHTML = html;
    el.querySelectorAll('table').forEach(t => {
      const w = document.createElement('div'); w.className = 'tw';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    crumb.textContent = path;
    document.title = (DOCS.find(d=>d.p===path)?.t || path) + ' — Ascent pack';

    if (window.mermaid && el.querySelector('.mermaid')){
      try { await mermaid.run({nodes: el.querySelectorAll('.mermaid')}); } catch(e){}
    }
    window.scrollTo(0,0);
    markActive();
  } catch (e) {
    el.innerHTML = '<div class="err"><strong>Could not load <code>'+path+'</code></strong><br>'+e.message+'</div>';
  }
}

(async function init(){
  try {
    const r = await fetch('visuals/docmanifest.json', {cache:'no-cache'});
    DOCS = await r.json();
  } catch(e){ DOCS = [{g:'Brief', p:'README.md', t:'README'}]; }
  document.getElementById('cnt').textContent = DOCS.length + ' documents · generated 2026-08-28';
  buildNav('');
  document.getElementById('filter').addEventListener('input', e => buildNav(e.target.value));
  addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>

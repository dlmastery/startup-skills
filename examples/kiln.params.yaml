# Fictional filled example — Kiln / Ember (industrial process OS).
# Copy the *shape*. Rewrite every field for the founder's actual idea.
# Do not reuse these nouns on a different idea.

company_name: Kiln
product_name: Kiln
codename: Ember
tagline: Process intelligence that keeps the line honest
one_liner: A multi-agent process OS that senses plant state, diagnoses the true constraint, and dispatches verified actions from job-shop to aerospace line.
domain: industrial manufacturing
category: AI-native process control / plant operating system
year: 2026

problem:
  industrial_trap: One quality engineer to many lines; one operator to many untrusted alarms. Firefighting consumes the attention that should sit inside the process.
  current_workarounds:
    - historian dashboards with no closed loop
    - tribal Excel and radio calls
    - SPC that flags after scrap is made
    - MES that records, does not decide
  cost_of_status_quo: scrap, unplanned downtime, hidden bottleneck hopping, operator distrust of black-box recommendations, delayed aerospace first-article.
  10x_claim: 10x faster constraint diagnosis and 10x fewer repeat defects at equal or higher throughput, across job-shop to aerospace, every shift modality.
  10x_mechanism: Recursive multimodal state-boundary probing + real-time load/risk control + dual-path process graph (repair the true gap while unlocking capacity) + action-suitability scoring + durable multi-resolution plant memory.

spectrum:
  low_end:
    name: Job-shop with no dedicated quality engineer
    description: Hidden process threats; dignity-preserving onboarding; same engine, modulated load — never a dumbed-down mode.
    dignity_rule: Never a "lite" reduced-capability mode. Same engine, modulated load and representation.
  mid_segments:
    - { name: Contract manufacturer, description: Several lines, leaky SOPs, needs gap-closing without shame. }
    - { name: Visual-first crew, description: Diagram, heat-map, and analogical encoding. }
    - { name: Numbers-first crew, description: SPC, proof, sequential encoding. }
  high_end:
    name: Aerospace / regulated first-article line
    description: Far-transfer, raised demand, no busywork dashboards.
  modality_axes: [visual, auditory, kinesthetic, analogical, symbolic, narrative, social]

personas:
  - id: operator
    role: user
    name: Night-shift line operator
    job: Keep the line running without being blamed for hidden gaps
    pains: [alarm floods, hidden constraint hops, stigma, wasted time]
    gains: [dignity, visible next action, dual-path repair plus capacity]
    must_have_language: "Don't make me feel dumb. Show me the real gap and the next win."
    day_in_life_beats: [handoff, adaptive run, productive-failure moment, teach-the-agent, reflection, manager summary]
  - id: plant_manager
    role: buyer
    name: Plant manager considering a new OS
    job: Cut scrap and downtime without a theater of dashboards
    pains: [black-box AI, no evidence pack, vendor lock-in]
    gains: [weekly insight, audit-aligned evidence, privacy of process IP]
    must_have_language: "Show me this is not another historian."
    day_in_life_beats: [Monday packet, midweek alert, board metric]
  - id: quality_lead
    role: operator
    name: Quality lead
    job: Escalate only the moments that need a human
    pains: [lesson mill of false alarms]
    gains: [highest-human-value moments only]
    must_have_language: "Give me the moment that needs a human."
    day_in_life_beats: [morning brief, escalation ping, evidence export]
  - id: vp_ops
    role: influencer
    name: VP operations
    job: One OS across sites; equalizer not amplifier
    pains: [site-by-site tools, un-auditable AI]
    gains: [flat lift across union / non-union, audit packet]
    must_have_language: "Equalizer, not amplifier of the best plant."
    day_in_life_beats: [pilot dashboard, compliance review]

core_loop:
  name: Sense-Diagnose-Dispatch-Act-Learn
  phases:
    - { id: sense, name: Sense, purpose: Map exact process boundary and load, signals: [multimodal traces, confidence], artifacts: [state-boundary map, load gauge] }
    - { id: diagnose, name: Diagnose, purpose: Name the true constraint, signals: [graph, traces], artifacts: [constraint card] }
    - { id: dispatch, name: Dispatch, purpose: Dual path — repair plus capacity, signals: [suitability score], artifacts: [locked path] }
    - { id: act, name: Act, purpose: Verified action on the line, signals: [operator generation, HITL], artifacts: [work instruction] }
    - { id: learn, name: Learn, purpose: Version memory, signals: [outcome, reflection], artifacts: [model bump] }

domain_science:
  - { name: Theory of Constraints, citation_hint: Goldratt, product_implication: Diagnose the true constraint; do not optimize local KPIs. }
  - { name: Statistical process control, citation_hint: Shewhart / Deming, product_implication: Signals before scrap; never a separate lite chart. }
  - { name: Human factors, citation_hint: Endsley situation awareness, product_implication: Load-aware stems; same engine for every crew. }

deep_tech:
  agents:
    - { name: assessor, job: Frontier probing }
    - { name: planner, job: Dual-path commit }
    - { name: verifier, job: Suitability gate }
    - { name: tutor, job: Generation-before-confirm on the line }
    - { name: memory, job: Versioned plant model }
  durable_model: Multi-resolution plant graph — knowledge, load history, identity of crews, accommodations — versioned together
  closed_loop: sense → diagnose → dispatch → act → measure → version
  evaluation: Named plant-loop bench with holdout lines
  not_vaporware:
    - on-prem fallback models
    - historian adapters
    - audit packet export
    - HITL six-minute take-room

features:
  top20: []
  top50: []
  technique_libraries: []

buyers: [plant manager, VP operations, quality director]
users: [operators, quality leads, process engineers]
beachhead: High-intent mid-size contract manufacturers with 2–6 lines and a quality firefight
gtm:
  dual_customer: true
  channels: [direct plant pilots, integrator partners]
  expansion: [job-shop → multi-site → aerospace]
  pricing_hypothesis: Site license plus outcome-linked scrap reduction

market:
  type: resegmented
  tam: Global discrete manufacturing process-software spend
  sam: US mid-market discrete plants with 50–500 people
  som: First 40 contract-manufacturer sites
  comps:
    - { name: Historian vendors, what_they_are: time-series recorders, gap: no dual-path decision }
    - { name: MES suites, what_they_are: record and route, gap: no live constraint diagnosis }
  neo_alternatives:
    - { name: Palantir-style foundry, unique: data integration, white_space: line-side dignity + dual path }
    - { name: Copilot-on-the-HMI, unique: chat on the panel, white_space: durable model + suitability gate }
  acquirers: [automation majors, MES vendors, industrial software platforms]

team:
  founder_advantage: Operator-plus-controls background; has been blamed for a hidden constraint
  current_strengths: [process graph, HITL design]
  next_hires:
    - { role: Plant-ops lead, impact: beachhead language }
    - { role: Compliance lead, impact: audit packets }

risks:
  - { name: Hallucinated setpoints, mitigation: suitability gate + HITL, residual: med }
  - { name: Process-IP leakage, mitigation: on-prem + tenant isolation, residual: low }

visual:
  product_ui_name: Ember Console
  palette: [navy, charcoal, muted-teal, cream, deep-indigo]
  density: extreme
  orientation: landscape
  backgrounds: [pure-white, cream, deep-indigo]
  must_look_like: real plant-console chrome for UX; elite systems diagram for architecture; founder board for Blank/VC

external_sources: []

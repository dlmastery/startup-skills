# params.schema.yaml — single source of truth for parameterization.
# Every skill reads params.yaml (this schema). Never hard-code a prior run's nouns.
# Instantiate by copying templates/params.yaml (empty) or examples/kiln.params.yaml (shape only).

company_name: string          # legal / brand name
product_name: string          # shipped product name (may equal company_name)
codename: string              # internal system name if different
tagline: string
one_liner: string             # one sentence, no jargon stacking
domain: string                # health | fintech | climate | industrial | education | ...
category: string              # more specific (precision diagnostics, grid dispatch, ...)
year: integer                 # "as of" year for surveys and market comps

problem:
  industrial_trap: string     # the legacy many-to-many inefficiency
  current_workarounds: [string]
  cost_of_status_quo: string
  10x_claim: string           # the headline transformation claim
  10x_mechanism: string       # why the claim is mechanistic, not marketing

spectrum:                     # underserved → elite. Never ship a single happy-path persona.
  low_end: { name: string, description: string, dignity_rule: string }
  mid_segments: [{ name: string, description: string }]
  high_end: { name: string, description: string }
  modality_axes: [string]     # how users differ (visual, analogical, verbal, hands-on, ...)

personas:                     # dual-sided if buyers ≠ users
  - id: string
    role: user | buyer | influencer | operator | investor
    name: string
    job: string
    pains: [string]
    gains: [string]
    must_have_language: string
    day_in_life_beats: [string]

core_loop:                    # Sense → Diagnose → Decide → Act → Learn, named for this domain
  name: string
  phases:
    - id: string
      name: string
      purpose: string
      signals: [string]
      artifacts: [string]

domain_science:               # non-negotiable principles (clinical evidence, control theory, ...)
  - name: string
    citation_hint: string
    product_implication: string

deep_tech:
  agents: [{ name: string, job: string }]
  durable_model: string       # what is versioned over months/years
  closed_loop: string         # sense → diagnose → decide → act → measure → update
  evaluation: string          # named bench / loop
  not_vaporware: [string]     # concrete stack, local-model options, production patterns

features:
  top20: [{ name: string, why: string, priority: 1-20 }]
  top50: [{ name: string, why: string, priority: 1-50 }]
  technique_libraries:
    - name: string
      grounding: string
      items: [string]

buyers: [string]
users: [string]
beachhead: string
gtm:
  dual_customer: boolean
  channels: [string]
  expansion: [string]
  pricing_hypothesis: string

market:
  type: existing | new | resegmented | clone
  tam: string
  sam: string
  som: string
  comps: [{ name: string, what_they_are: string, gap: string }]
  neo_alternatives: [{ name: string, unique: string, white_space: string }]
  acquirers: [string]

team:
  founder_advantage: string
  current_strengths: [string]
  next_hires: [{ role: string, impact: string }]

risks: [{ name: string, mitigation: string, residual: low | med | high }]

visual:
  product_ui_name: string
  palette: [string]
  density: extreme
  orientation: landscape
  backgrounds: [pure-white, cream, deep-indigo]
  must_look_like: string

external_sources:
  - url: string
    what_to_extract: string

output_dir: string            # where this run writes artifacts
source_run: string            # optional path to a prior transcript / PDF to audit against
